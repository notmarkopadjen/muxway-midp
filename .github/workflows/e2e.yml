name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      # Actions are pinned to commit SHAs; the tag is in the comment.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The suite builds the hub from the core repository. While that is
      # private, CI needs a read token for it; without one the suite runs
      # on developers' machines only and CI says so.
      - name: Is the core repository reachable
        id: gate
        env:
          CORE_TOKEN: ${{ secrets.MUXWAY_CORE_TOKEN }}
        run: echo "core=$([ -n "$CORE_TOKEN" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Check out the core repository
        id: core
        if: steps.gate.outputs.core == 'yes'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: notmarkopadjen/muxway
          token: ${{ secrets.MUXWAY_CORE_TOKEN }}
          path: muxway-core
          persist-credentials: false

      - name: Run end-to-end tests
        id: run
        env:
          HAVE_CORE: ${{ steps.core.outcome }}
          MUXWAY_CORE: ${{ github.workspace }}/muxway-core
        run: |
          if [ ! -x scripts/e2e.sh ]; then
            echo "no end-to-end suite yet"
            echo "suite=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HAVE_CORE" != "success" ]; then
            echo "::notice::end-to-end tests skipped: no access to the core repository (secret MUXWAY_CORE_TOKEN)"
            echo "suite=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apt-get update -q && sudo apt-get install -y -q tmux xvfb xdotool imagemagick openjdk-8-jdk-headless
          echo "suite=yes" >> "$GITHUB_OUTPUT"
          scripts/e2e.sh

      - name: Keep logs, screenshots and traces
        if: always() && steps.run.outputs.suite == 'yes'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-run-${{ github.run_id }}
          path: test-runs/
          retention-days: 90

      - name: Check run with per-test results
        if: always() && steps.run.outputs.suite == 'yes'
        uses: dorny/test-reporter@dc3a92680fcc15842eef52e8c4606ea7ce6bd3f3 # v2.1.1
        with:
          name: e2e results
          path: test-runs/*/results.xml
          reporter: java-junit

      - name: Record the run as an issue
        if: always() && steps.run.outputs.suite == 'yes' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/record-run.sh test-runs/*/
