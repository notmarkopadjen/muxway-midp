name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      # Actions are pinned to commit SHAs; the tag is in the comment.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The suite builds the hub and the agent from the core repository.
      - name: Check out the core repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: notmarkopadjen/muxway
          path: muxway-core
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: muxway-core/go.mod
          cache: false

      # The runner's default JDK is newer; the build needs JDK 8 for Java 1.1 class files.
      - name: Run end-to-end tests
        env:
          MUXWAY_CORE: ${{ github.workspace }}/muxway-core
          JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tmux xvfb xdotool imagemagick openjdk-8-jdk-headless
          scripts/e2e.sh

      - name: Keep logs, screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-run-${{ github.run_id }}
          path: test-runs/
          retention-days: 90

      # A pull request from a fork runs with a read-only token and cannot
      # write check runs; its results are in the artifact and the job log.
      - name: Check run with per-test results
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: e2e results
          path: test-runs/*/results.xml
          reporter: java-junit

      - name: Record the run as an issue
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/record-run.sh test-runs/*/
